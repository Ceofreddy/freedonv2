<!doctype html>
<html lang="en" dir="auto">
    <head>
        <link rel="manifest" href="/manifest.json" />
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/freedon-logo.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-8P71Q1RGDX"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag('js', new Date());

            gtag('config', 'G-8P71Q1RGDX');
        </script>

        <!-- Primary Meta Tags -->
        <meta name="title" content="Freedon - Advanced Trading Hub" />
        <meta
            name="description"
            content="Freedon: The advanced trading hub for automated strategies and market analysis."
        />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Freedon - Advanced Trading Hub" />
        <meta
            property="og:description"
            content="Freedon: The advanced trading hub for automated strategies and market analysis."
        />
        <meta property="og:image" content="/freedon-logo.svg" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:title" content="Freedon - Advanced Trading Hub" />
        <meta
            property="twitter:description"
            content="Freedon: The advanced trading hub for automated strategies and market analysis."
        />
        <meta property="twitter:image" content="/freedon-logo.svg" />

        <!-- Additional SEO Meta -->
        <meta name="keywords" content="Freedon, trading bot, automated trading, market analysis, financial tools" />
        <meta name="robots" content="index, follow" />
        <meta name="theme-color" content="#0E0E11" />

        <title>Freedon - Advanced Trading Hub</title>

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "Freedon",
                "url": "https://freedon.live/",
                "potentialAction": {
                    "@type": "SearchAction",
                    "target": "https://freedon.live/?q={search_term_string}",
                    "query-input": "required name=search_term_string"
                }
            }
        </script>
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "Freedon",
                "url": "https://freedon.live/",
                "logo": "https://freedon.live/freedon-logo.svg",
                "sameAs": []
            }
        </script>

        <style>
            :root {
                font-size: 62.5%;
            }
        </style>
    </head>

    <body class="body theme theme--light">
        <div id="modal_root" class="modal-root"></div>
        <div id="popup_root" class="popup-root"></div>
        <div id="root"></div>
    </body>
</html>
