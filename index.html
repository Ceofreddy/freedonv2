<!doctype html>
<html lang="en" dir="auto">
  <head>
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/freedon-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <meta name="title" content="Freedon - Advanced Trading Hub" />
    <meta
      name="description"
      content="Freedon: The advanced trading hub for automated strategies and market analysis."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Freedon - Advanced Trading Hub" />
    <meta
      property="og:description"
      content="Freedon: The advanced trading hub for automated strategies and market analysis."
    />
    <meta property="og:image" content="/freedon-logo.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Freedon - Advanced Trading Hub" />
    <meta
      property="twitter:description"
      content="Freedon: The advanced trading hub for automated strategies and market analysis."
    />
    <meta property="twitter:image" content="/freedon-logo.svg" />

    <!-- Additional SEO Meta -->
    <meta name="keywords" content="Freedon, trading bot, automated trading, market analysis, financial tools" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0E0E11" />
    
    <title>Freedon - Advanced Trading Hub</title>

    <style>
      :root {
        font-size: 62.5%;
      }
    </style>
  </head>

  <body class="body theme theme--light">
    <div id="modal_root" class="modal-root"></div>
    <div id="popup_root" class="popup-root"></div>
    <div id="root"></div>
  </body>
</html>
